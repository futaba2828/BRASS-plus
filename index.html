<script>
/* BRASS+はRenderのURLを正規URLとして使い、LINE・ホーム画面間の保存先をそろえる */
(function(){
 try {
  if (location.hostname === 'futaba2828.github.io') {
   const q = new URLSearchParams(location.search);
   if (!q.has('group')) {
    const c = JSON.parse(localStorage.getItem('BRASS_PLUS_SERVER_V1') || '{}');
    if (c.code) q.set('group', c.code);
   }
   const suffix = q.toString() ? '?' + q.toString() : '';
   location.replace('https://brass-plus.onrender.com/' + suffix);
  }
 } catch (e) { location.replace('https://brass-plus.onrender.com/'); }
})();
</script>
<style>
:root{--c:#6b8f8a;--soft:#eef4f2;--soft2:#f7faf9;--text:#263331;--muted:#70807d;--line:#dbe5e2;--danger:#b85c62;--white:#fff}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;color:var(--text);background:linear-gradient(135deg,var(--soft2),var(--soft));}
button,input,textarea,select{font:inherit}button{cursor:pointer}

.brand{display:flex;align-items:center;gap:10px}.brand h1{margin:0;font-size:22px;letter-spacing:.06em}.brand small{color:var(--muted)}
.search{margin-top:10px;width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:12px;background:#fff;outline:none}.search:focus{border-color:var(--c);box-shadow:0 0 0 3px var(--soft)}

.card{background:rgba(255,255,255,.9);border:1px solid var(--line);border-radius:18px;padding:15px;margin:12px 0;box-shadow:0 5px 20px rgba(42,65,61,.05)}.card h3{margin:0 0 11px;font-size:17px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
.stat{padding:13px;border-radius:14px;background:var(--soft)}.stat b{font-size:21px;display:block}.muted{color:var(--muted);font-size:13px}.quote{font-size:18px;line-height:1.7;border-left:4px solid var(--c);padding-left:12px}
.row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.between{display:flex;justify-content:space-between;gap:10px;align-items:center}.right{margin-left:auto}

.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:var(--soft);color:var(--c);font-size:12px;margin:2px}.tag{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 8px;font-size:12px}.tag.selected{background:var(--c);color:#fff;border-color:var(--c)}

.shift{border:1px solid var(--line);border-radius:13px;padding:10px;margin:8px 0;background:var(--soft2)}.shift h4{margin:0 0 7px}.audio{width:100%;margin-top:7px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:#263331;color:#fff;padding:10px 15px;border-radius:999px;opacity:0;pointer-events:none;transition:.25s;z-index:100}.toast.show{opacity:1;transform:translateX(-50%)}

.empty{padding:20px;text-align:center;color:var(--muted)}.link{color:var(--c);text-decoration:underline}.analysis{background:var(--soft);border-radius:14px;padding:13px;line-height:1.7}
.choice-grid{display:flex;gap:7px;flex-wrap:wrap}.choice{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 11px}.choice.selected{background:var(--c);color:#fff;border-color:var(--c)}

let brassIconImage=null;
function updateBrassIcons(color){
 try{
  const c=document.createElement('canvas');c.width=180;c.height=180;
  const x=c.getContext('2d',{willReadFrequently:true});
  const draw=()=>{
   x.clearRect(0,0,180,180);
   // Keep the supplied music-note and sparkle artwork, recolor only its pink background.
   x.drawImage(brassIconImage,0,0,180,180);
   const im=x.getImageData(0,0,180,180),d=im.data;
   const h=(color||'#dca0c6').replace('#','');
   const tr=parseInt(h.slice(0,2),16),tg=parseInt(h.slice(2,4),16),tb=parseInt(h.slice(4,6),16);
   for(let i=0;i<d.length;i+=4){
    const r=d[i],g=d[i+1],b=d[i+2];
    // Pink pixels are red/blue dominant; leave the white note, sparkle and white highlights intact.
    if(r>g*1.04 && b>g*1.02 && r<245 && g<225 && b<245){
     const lum=(r*0.299+g*0.587+b*0.114)/255;
     const factor=0.76+lum*0.30;
     d[i]=Math.min(255,tr*factor);d[i+1]=Math.min(255,tg*factor);d[i+2]=Math.min(255,tb*factor);
    }
   }
   x.putImageData(im,0,0);
   const url=c.toDataURL('image/png');
   const f=document.getElementById('brassFavicon');if(f)f.href=url;
   const a=document.getElementById('brassAppleIcon');if(a)a.href=url;
   const m=document.getElementById('brassThemeMeta');if(m)m.content=color||'#dca0c6';
  };
  if(brassIconImage && brassIconImage.complete){draw();return;}
  brassIconImage=new Image();brassIconImage.onload=draw;brassIconImage.src=BRASS_ICON_SOURCE;
 }catch(e){console.warn('BRASS+ icon update unavailable',e)}
}
function applyTheme(){document.documentElement.style.setProperty('--c',S.profile.theme||'#6b8f8a');let c=S.profile.theme||'#6b8f8a';document.documentElement.style.setProperty('--soft',hex(c,.12));document.documentElement.style.setProperty('--soft2',hex(c,.045));document.getElementById('groupLabel').textContent=S.profile.group||'グループ未設定';updateBrassIcons(c)}
function hex(h,a){h=h.replace('#','');if(h.length===3)h=h.split('').map(x=>x+x).join('');let n=parseInt(h,16);return `rgba(${n>>16},${n>>8&255},${n&255},${a})`}
function nav(){let base=[['home','ホーム'],['goals','目標'],['practice','練習'],['issues','課題点'],['morning','朝練'],['songs','曲リスト'],['records','記録'],['voice','みんなの声']],order=S.navOrder||base.map(x=>x[0]);let prefs=S.sectionPrefs||{};return order.map(k=>base.find(x=>x[0]===k)).filter(Boolean).filter(x=>prefs[x[0]]?.visible!==false)}
function renderNav(){
 let n=document.getElementById('nav');
 n.innerHTML=nav().map(x=>`<button type="button" data-nav="${x[0]}" class="${S.view===x[0]?'active':''}">${x[1]}</button>`).join('');
 n.querySelectorAll('button').forEach(b=>{
   let timer=null, dragging=false, startX=0, moved=false;
   const clear=()=>{if(timer){clearTimeout(timer);timer=null;}};
   b.addEventListener('pointerdown',e=>{
     if(e.pointerType==='mouse' && e.button!==0)return;
     startX=e.clientX; moved=false; dragging=false; clear();
     timer=setTimeout(()=>{
       dragging=true; b.dataset.longPressed='1'; b.classList.add('nav-dragging');
       try{b.setPointerCapture(e.pointerId)}catch(_){ }
     },380);
   });
   b.addEventListener('pointermove',e=>{
     if(!dragging){
       if(Math.abs(e.clientX-startX)>8){moved=true;clear();}
       return;
     }
     e.preventDefault();
     const target=[...n.querySelectorAll('button')].find(x=>x!==b && e.clientX>=x.getBoundingClientRect().left && e.clientX<=x.getBoundingClientRect().right);
     if(!target)return;
     const buttons=[...n.querySelectorAll('button')], from=buttons.indexOf(b), to=buttons.indexOf(target);
     if(from<0||to<0||from===to)return;
     if(from<to) n.insertBefore(b,target.nextSibling); else n.insertBefore(b,target);
     S.navOrder=[...n.querySelectorAll('button')].map(x=>x.dataset.nav);
   });
   b.addEventListener('pointerup',e=>{
     clear();
     if(dragging){
       dragging=false; b.classList.remove('nav-dragging');
       S.navOrder=[...n.querySelectorAll('button')].map(x=>x.dataset.nav); saveNavOrder();
       setTimeout(()=>b.dataset.longPressed='0',80);
       return;
     }
     if(moved)return;
   });
   b.addEventListener('pointercancel',()=>{clear();dragging=false;b.classList.remove('nav-dragging');});
   b.addEventListener('click',e=>{
     e.preventDefault(); e.stopPropagation();
     if(b.dataset.longPressed==='1'){b.dataset.longPressed='0';return;}
     go(b.dataset.nav);
   });
   b.addEventListener('pointerleave',()=>{if(!dragging)clear();});
 });
}
function saveNavOrder(){
  S.navOrder=[...new Set((S.navOrder||[]).filter(k=>['home','goals','practice','issues','morning','songs','records','voice'].includes(k)))];
  save();
}
function go(v){S.view=v;render()}
function openRecords(){go('records')}
function render(){applyTheme();renderNav();let m=document.getElementById('main');let f={home:home,goals:goals,practice:practice,issues:issues,morning:morning,songs:songs,records:records,voice:voice,settings:settings}[S.view]||home;try{m.innerHTML=f()}catch(e){console.error('BRASS+画面表示エラー',S.view,e);m.innerHTML=`<section class="page active"><div class="hero"><h2>${S.view==='records'?'記録':'画面を開けませんでした'}</h2></div><div class="card"><p>表示中にエラーが起きました。もう一度タップしてください。</p><button class="btn primary" onclick="go('records')">記録を開き直す</button></div></section>`}}
function home(){

function sharedCollections(){return ['goals','practices','issues','mornings','songs','lessons','posts','recommendations','voices','tags','scaleChecks']}
function collectShared(){const out={};for(const k of sharedCollections()){const v=S[k];if(k==='mornings')out[k]=v||{};else if(Array.isArray(v))out[k]=v.filter(x=>x && x.share!=='private');else out[k]=v||{};}return out}
function mergeShared(remote,replace=false){if(!remote)return;for(const k of sharedCollections()){if(k==='mornings'){S.mornings=replace?{...(remote[k]||{})}:Object.assign({},S.mornings||{},remote[k]||{});continue}if(k==='tags'){const remoteTags=Array.isArray(remote[k])?remote[k].filter(x=>typeof x==='string'):[];S.tags=replace?[...new Set(remoteTags)]:[...new Set([...(S.tags||[]),...remoteTags])];continue}if(k==='scaleChecks'){S.scaleChecks=replace?(remote[k]||{}):Object.assign({},S.scaleChecks||{},remote[k]||{});continue}if(!Array.isArray(S[k])||!Array.isArray(remote[k]))continue;const local=Array.isArray(S[k])?S[k]:[];const keep=replace?local.filter(x=>x&&x.share==='private'):local;const map=new Map(keep.map(x=>[x.id,x]));for(const x of remote[k]){if(!x?.id)continue;map.set(x.id,x)}S[k]=[...map.values()]}}
async function serverRefresh(show=false,replace=false){const c=serverConfig();if(!c.code||!serverBase())return false;try{const d=await serverJson('/api/groups/'+encodeURIComponent(c.code));if(serverConfig().code!==c.code)return false;serverMembers=d.members||[];if(replace)S.profile.group=d.name||c.code;mergeShared(d.data,replace);saveCurrentGroupSnapshot(c.code);saveLocalOnly();render();renderGroupMembers();if(show)toast('共有データを同期しました');return true}catch(e){if(show)toast('同期できません：'+e.message);return false}}

function goals(){
 let y=currentCal.getFullYear(),m=currentCal.getMonth(),first=new Date(y,m,1).getDay(),totalDays=new Date(y,m+1,0).getDate(),weeks=[];
 let weekCount=Math.ceil((first+totalDays)/7);
 for(let w=0;w<weekCount;w++){
   let cells='',segments=[],lanes=[];
   for(let d=0;d<7;d++){
     let n=w*7+d-first+1, dt=new Date(y,m,n), inMonth=dt.getMonth()===m, ds=`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
     cells+=`<div class="goal-day ${inMonth?'':'other'} ${ds===today()?'today':''}" onclick="${inMonth?`addGoal('${ds}')`:''}"><span class="num">${inMonth?n:''}</span></div>`;
   }
   let weekStart=new Date(y,m,w*7-first+1);weekStart.setHours(12,0,0,0);
   let weekEnd=new Date(weekStart);weekEnd.setDate(weekStart.getDate()+6);
   let active=S.goals.filter(g=>g.start&&g.end&&new Date(g.end+'T12:00:00')>=weekStart&&new Date(g.start+'T12:00:00')<=weekEnd).sort((a,b)=>(a.start||'').localeCompare(b.start||''));
   active.forEach(g=>{
     let gs=new Date(g.start+'T12:00:00'),ge=new Date(g.end+'T12:00:00');
     let sd=Math.max(0,Math.floor((gs-weekStart)/86400000)),ed=Math.min(6,Math.floor((ge-weekStart)/86400000));
     let lane=0;while(lanes[lane]?.some(r=>sd<=r.ed+0.2&&ed>=r.sd-0.2))lane++;
     (lanes[lane]||(lanes[lane]=[])).push({sd,ed});
     let title=esc(g.title),type=goalTypeNum(g.type);segments.push(`<button class="goal-bar goal${type}" style="grid-column:${sd+1}/span ${ed-sd+1};top:${lane*25}px" onclick="event.stopPropagation();editGoal('${g.id}')">${title}</button>`);
   });
   let h=Math.max(64,34+lanes.length*25);weeks.push(`<div class="goal-week" style="height:${h}px"><div class="goal-days">${cells}</div><div class="goal-bars">${segments.join('')}</div></div>`);
 }
 return `<section class="page active"><div class="hero"><h2>目標</h2></div><div class="card"><div class="between"><button class="btn" onclick="moveCal(-1)">‹</button><b>${y}年${m+1}月</b><button class="btn" onclick="moveCal(1)">›</button></div><div class="goal-calendar" style="margin-top:9px"><div class="goal-dows">${['日','月','火','水','木','金','土'].map(x=>`<div>${x}</div>`).join('')}</div>${weeks.join('')}</div></div><div class="card"><div class="between"><h3>目標一覧</h3><button class="btn primary" onclick="addGoal()">＋目標</button></div>${S.goals.length?S.goals.map(goalCard).join(''):'<div class="empty">目標を登録してください</div>'}</div></section>`
}

function goalTypeNum(t){return ['グループ目標（行動）','グループ目標（演奏）','個人目標（行動）','個人目標（演奏）'].indexOf(t)+1||1}
function goalCard(g){return `<div class="item swipe" data-id="${g.id}" data-type="goal"><div class="item-main"><div class="between"><div><b>${esc(g.title)}</b><span class="badge">${esc(g.type)}</span></div><div class="stars">${[1,2,3,4,5].map(n=>`<button class="star ${n<=g.star?'on':''}" onclick="event.stopPropagation();setGoalStar('${g.id}',${n})">★</button>`).join('')}</div></div><div class="muted">${g.start||g.end?`期間：${esc(g.start||'未設定')} ～ ${esc(g.end||'未設定')}`:''}・登録：${esc(g.by||'')}</div></div><div class="item-actions"><button onclick="editGoal('${g.id}')">編集</button><button class="del" onclick="delGoal('${g.id}')">削除</button></div></div>`}
function addGoal(date=''){openModal(`<h3>目標を登録</h3><label>題名 *</label><input id="gTitle"><label>種類</label><select id="gType"><option>グループ目標（行動）</option><option>グループ目標（演奏）</option><option>個人目標（行動）</option><option>個人目標（演奏）</option></select><div class="formgrid"><div><label>開始日</label><input id="gStart" type="date" value="${date}"></div><div><label>終了日</label><input id="gEnd" type="date"></div></div><label>公開範囲</label><select id="gShare"><option value="group">グループで共有</option><option value="private">自分だけ</option></select><div class="muted">登録者：${esc(S.profile.name||'未設定')}</div><label>★</label><input id="gStar" type="range" min="1" max="5" value="1"><div class="row"><button class="btn primary" onclick="saveGoal()">保存</button><button class="btn" onclick="closeModal()">閉じる</button></div>`)}
function saveGoal(id){let title=val('gTitle');if(!title)return toast('題名を入力してください');S.goals.push({id:uid(),title,type:val('gType'),start:val('gStart'),end:val('gEnd'),by:S.profile.name||'未設定',share:val('gShare')||'group',star:+document.getElementById('gStar').value,created:today()});closeModal();save();toast('目標を保存しました')}
function openGoal(id){editGoal(id)}
function editGoal(id){let g=S.goals.find(x=>x.id===id);if(!g)return;openModal(`<h3>目標を編集</h3><label>題名 *</label><input id="gTitle" value="${esc(g.title)}"><label>種類</label><select id="gType">${['グループ目標（行動）','グループ目標（演奏）','個人目標（行動）','個人目標（演奏）'].map(x=>`<option ${x===g.type?'selected':''}>${x}</option>`).join('')}</select><div class="formgrid"><div><label>開始日</label><input id="gStart" type="date" value="${g.start||''}"></div><div><label>終了日</label><input id="gEnd" type="date" value="${g.end||''}"></div></div><label>公開範囲</label><select id="gShare"><option value="group" ${g.share!=='private'?'selected':''}>グループで共有</option><option value="private" ${g.share==='private'?'selected':''}>自分だけ</option></select><div class="muted">登録者：${esc(g.by||S.profile.name||'未設定')}</div><label>★</label><input id="gStar" type="range" min="1" max="5" value="${g.star}"><div class="row"><button class="btn primary" onclick="updateGoal('${id}')">保存</button><button class="btn danger" onclick="delGoal('${id}')">削除</button></div>`)}
function updateGoal(id){let g=S.goals.find(x=>x.id===id);g.title=val('gTitle');g.type=val('gType');g.start=val('gStart');g.end=val('gEnd');g.by=g.by||S.profile.name||'未設定';g.share=val('gShare')||'group';g.star=+document.getElementById('gStar').value;closeModal();save()}
function setGoalStar(id,n){let g=S.goals.find(x=>x.id===id);g.star=n;save();toast(n===5?'目標を★5にしました':'★を更新しました')}
function delGoal(id){S.goals=S.goals.filter(x=>x.id!==id);closeModal();save();toast('削除しました')}
function moveCal(n){currentCal.setMonth(currentCal.getMonth()+n);render()}

function practice(){
 const scales=['B♭','H','C','D♭','D','E♭','E','F','G♭','G','A♭','A','B♭(8va)'];
 return `<section class="page active"><div class="hero"><h2>練習</h2><p>ピン留めした練習はすべてホームに表示されます。</p></div><div class="card"><button class="btn primary" onclick="addPractice()">＋練習を登録</button><span class="swipe-hint">　左右にスワイプすると編集・削除</span></div>${S.practices.length?S.practices.map(practiceCard).join(''):'<div class="empty">練習はまだありません</div>'}<div class="card"><h3>長音階リスト</h3><p class="muted">タップすると色が変わり、達成状況を保存します。</p><div class="choice-grid">${scales.map(x=>`<button type="button" class="choice ${S.scaleChecks?.[x]?'selected':''}" onclick="toggleScale('${x}')">${x}</button>`).join('')}</div></div>${mySlideSection()}</section>`
}
function toggleScale(x){S.scaleChecks=S.scaleChecks||{};S.mySlides=S.mySlides||[];S.sectionPrefs=S.sectionPrefs||{};S.scaleChecks[x]=!S.scaleChecks[x];save()}

function mySlideSection(){if(S.mySlidesHidden)return `<div class="card"><div class="between"><h3>Myポジション表</h3><button class="btn" onclick="toggleMySlides()">表示する</button></div><p class="muted">この端末だけの自分用メモです。グループには共有されません。</p></div>`;return `<div class="card"><div class="between"><h3>Myポジション表</h3><div class="row"><button class="btn small" onclick="toggleMySlides()">非表示</button><button class="btn primary" onclick="mySlideForm()">＋音を登録</button></div></div><p class="muted">自分用の音名・ポジション・メモです。グループには共有されません。</p>${(S.mySlides||[]).length?(S.mySlides||[]).map(mySlideCard).join(''):'<div class="empty">まだ音が登録されていません</div>'}</div>`}
function toggleMySlides(){S.mySlidesHidden=!S.mySlidesHidden;save()}
function mySlideCard(x){return `<div class="item swipe" data-id="${x.id}" data-type="myslide"><div class="item-main" onclick="mySlideForm('${x.id}')"><div class="between"><b>${esc(x.note)}</b><span class="badge">${esc(x.position||'ポジション未設定')}</span></div>${x.memo?`<div class="muted">${esc(x.memo)}</div>`:''}${x.x!=null?`<div class="muted">画像位置：${Math.round(x.x*100)}%</div>`:''}</div><div class="item-actions"><button onclick="mySlideForm('${x.id}')">編集</button><button class="del" onclick="deleteMySlide('${x.id}')">削除</button></div></div>`}
function mySlideForm(id){let x=id&&(S.mySlides||[]).find(a=>a.id===id),img=SLIDE_IMAGE;openModal(`<h3>${x?'ポジション表を編集':'ポジション表に音を登録'}</h3><label>音名 *</label><input id="msNote" value="${esc(x?.note||'')}" placeholder="例：B♭、F、H"><label>ポジション</label><input id="msPos" value="${esc(x?.position||'')}" placeholder="必要なら自分で入力"><label>文字メモ</label><textarea id="msMemo" placeholder="例：少し前め、チューナーで低めに取る">${esc(x?.memo||'')}</textarea><label>トロンボーン上の位置をタップ</label><div class="slide-image-wrap" id="slideMap"><img src="${img}" onclick="pickSlidePosition(event)"><div id="slideMarker" class="slide-marker" style="left:${x?.x!=null?x.x*100:50}%"></div><div id="slideMarkerLabel" class="slide-marker-label">${esc(x?.position||'')}</div></div><p class="muted">画像をタップした場所に線が入り、その音専用の位置として保存されます。ポジション名は自分で入力できます。</p><div class="row"><button class="btn primary" onclick="saveMySlide('${x?.id||''}')">保存</button><button class="btn" onclick="closeModal()">閉じる</button></div>`)}
function pickSlidePosition(e){let box=document.getElementById('slideMap'),r=box.getBoundingClientRect(),x=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));document.getElementById('slideMarker').style.left=(x*100)+'%';document.getElementById('slideMarkerLabel').textContent='';document.getElementById('slideMap').dataset.x=x}
function saveMySlide(id){let note=val('msNote');if(!note)return toast('音名を入力してください');let old=id&&(S.mySlides||[]).find(x=>x.id===id),box=document.getElementById('slideMap'),x=box?.dataset.x!=null?+box.dataset.x:(old?.x??.5),d={id:id||uid(),note,position:val('msPos'),memo:val('msMemo'),x};S.mySlides=S.mySlides||[];if(old)Object.assign(old,d);else S.mySlides.push(d);closeModal();save();toast('ポジション表を保存しました')}
function deleteMySlide(id){S.mySlides=(S.mySlides||[]).filter(x=>x.id!==id);save();toast('削除しました')}

function practiceCard(p){return `<div class="item swipe" data-id="${p.id}" data-type="practice"><div class="item-main"><div class="between"><b>${esc(p.title)}</b><span><button class="iconbtn" onclick="event.stopPropagation();togglePin('${p.id}')">${p.pin?'★':'☆'}</button><button class="btn small" onclick="event.stopPropagation();togglePractice('${p.id}')">${p.done?'完了済み':'完了'}</button></span></div><div class="row">${p.duration?`<span class="badge">${esc(p.duration)}分</span>`:''}${p.bpm?`<span class="badge">${esc(p.bpm)} BPM</span>`:''}${p.scale?`<span class="badge">${esc(p.scale)}</span>`:''}</div>${p.how?`<div class="muted">方法：${esc(p.how)}</div>`:''}${p.memo?`<div>${esc(p.memo)}</div>`:''}${S.issues.filter(i=>i.source==='practice'&&i.sourceId===p.id).length?`<div class="issue-link"><b>課題点</b>${S.issues.filter(i=>i.source==='practice'&&i.sourceId===p.id).map(i=>`<div>${esc(i.title)}${i.measure?`・${esc(i.measure)}小節目`:''}</div>`).join('')}</div>`:''}${p.audio?`<audio class="audio" controls src="${p.audio}"></audio>`:''}<div class="muted">${esc(p.by||'')}・${esc(p.date||'')}</div></div><div class="item-actions"><button onclick="editPractice('${p.id}')">編集</button><button class="del" onclick="delPractice('${p.id}')">削除</button></div></div>`}
function addPractice(id){let p=id&&S.practices.find(x=>x.id===id);openPracticeModal(p)}
function openPracticeModal(p){
 openModal(`<h3>${p?'練習を編集':'練習を登録'}</h3><label>練習名 *</label><input id="pTitle" value="${esc(p?.title||'')}"><div class="formgrid"><div><label>時間（分）</label><input id="pDur" type="number" value="${p?.duration||''}"></div><div><label>BPM</label><input id="pBpm" type="number" value="${p?.bpm||''}"></div></div><label>やり方</label><textarea id="pHow">${esc(p?.how||'')}</textarea><label>メモ</label><textarea id="pMemo">${esc(p?.memo||'')}</textarea><label>写真/動画/ファイルを選択</label><input id="pAudio" type="file" accept="audio/*,image/*,video/*" multiple>${p?.audio?`<audio class="audio" controls src="${p.audio}"></audio>`:''}<label>公開範囲</label><select id="pShare"><option ${p?.share!=='private'?'selected':''} value="group">グループで共有</option><option ${p?.share==='private'?'selected':''} value="private">自分だけ</option></select><div class="muted">登録者：${esc(p?.by||S.profile.name||'未設定')}</div><div class="row"><button class="btn primary" onclick="savePractice('${p?.id||''}')">保存</button><button class="btn" onclick="savePracticeAndAddIssue('${p?.id||''}')">保存して課題点を追加</button><button class="btn" onclick="closeModal()">閉じる</button></div>`);
}
function savePractice(id,afterSave){
 let title=val('pTitle');if(!title)return null;let old=id&&S.practices.find(x=>x.id===id),file=document.getElementById('pAudio')?.files[0],newId=id||uid();
 let finish=(audio)=>{let d={id:newId,title,duration:val('pDur'),bpm:val('pBpm'),scale:'',how:val('pHow'),memo:val('pMemo'),share:val('pShare'),pin:old?.pin||false,done:old?.done||false,by:old?.by||S.profile.name,date:old?.date||today(),audio:audio||old?.audio||''};if(old)Object.assign(old,d);else S.practices.unshift(d);closeModal();save();toast('練習を保存しました');if(afterSave)afterSave(newId);};
 if(file){let r=new FileReader();r.onload=()=>finish(r.result);r.readAsDataURL(file)}else finish();return newId
}
function savePracticeAndAddIssue(id){let title=val('pTitle');if(!title)return toast('練習名を入力してください');savePractice(id,newId=>{setTimeout(()=>issueForm(null,'practice',newId),80)})}

function editPractice(id){addPractice(id)}
function delPractice(id){S.practices=S.practices.filter(x=>x.id!==id);save();toast('削除しました')}
function togglePractice(id){let p=S.practices.find(x=>x.id===id);p.done=!p.done;save();toast(p.done?'練習を完了しました':'完了を取り消しました')}
function togglePin(id){let p=S.practices.find(x=>x.id===id);p.pin=!p.pin;save();toast(p.pin?'ピン留めしました':'ピン留めを外しました')}


function tagPicker(selected=[]){return `<div id="tagBox" class="row">${(S.tags||[]).map(t=>`<span class="tag-wrap"><button type="button" class="tag ${selected.includes(t)?'selected':''}" onclick="this.classList.toggle('selected')">${esc(t)}</button><button type="button" class="tag-remove" aria-label="${esc(t)}を削除" onclick="removeSavedTag(decodeURIComponent('${encodeURIComponent(t)}'))">×</button></span>`).join('')}</div><div class="row" style="margin-top:7px"><input id="newTag" placeholder="新しいタグ"><button type="button" class="btn small" onclick="addTagTemp()">追加</button></div><p class="muted">保存済みタグの「×」で削除できます。</p>`}
function addTagTemp(){let x=val('newTag');if(!x)return;S.tags=S.tags||[];if(!S.tags.includes(x))S.tags.push(x);let box=document.getElementById('tagBox');if(box){let span=document.createElement('span');span.className='tag-wrap';let b=document.createElement('button');b.type='button';b.className='tag selected';b.textContent=x;b.onclick=()=>b.classList.toggle('selected');let rm=document.createElement('button');rm.type='button';rm.className='tag-remove';rm.textContent='×';rm.setAttribute('aria-label',x+'を削除');rm.onclick=()=>removeSavedTag(x);span.append(b,rm);box.appendChild(span)}document.getElementById('newTag').value='';saveLocalOnly();serverSync()}
function removeSavedTag(tag){if(!confirm(`保存済みタグ「${tag}」を削除しますか？`))return;S.tags=(S.tags||[]).filter(t=>t!==tag);document.querySelectorAll('#tagBox .tag-wrap').forEach(el=>{if(el.querySelector('.tag')?.textContent===tag)el.remove()});saveLocalOnly();serverSync();toast('タグを削除しました')}
function selectedTags(){return [...document.querySelectorAll('#tagBox .tag.selected')].map(x=>x.textContent)}
function issueForm(x,presetSource='',presetId=''){
 let source=x?.source||presetSource,sourceId=x?.sourceId||presetId,shifts=['1st','2nd','3rd','4th','Bass'],shiftSel=x?.shifts||[];
 let defaultPeople=x?.shiftPeople||{};
 if(!x && source==='song'){let so=S.songs.find(z=>z.id===sourceId);defaultPeople=so?.shiftNames||{}}
 openModal(`<h3>${x?'課題点を編集':'課題点を登録'}</h3><label>課題点 *</label><input id="iTitle" value="${esc(x?.title||'')}">
 <label>どこからの課題？</label><select id="iSource" onchange="refreshIssueSource()"><option value="">選択してください</option><option value="song" ${source==='song'?'selected':''}>曲</option><option value="practice" ${source==='practice'?'selected':''}>練習</option></select><div id="issueSourceBox">${issueSourceSelect(source,sourceId)}</div>
 <div class="formgrid"><div><label>小節番号（範囲）</label><div class="formgrid"><input id="iMeasureStart" inputmode="numeric" placeholder="開始" value="${esc(x?.measureStart||x?.measure||'')}"><input id="iMeasureEnd" inputmode="numeric" placeholder="終了（任意）" value="${esc(x?.measureEnd||'')}"></div></div><div><label>課題の詳細</label><input id="iDetail" value="${esc(x?.detail||'')}" placeholder="音程・リズムなど"></div></div>
 <label>シフト（タップして選択）</label><div id="shiftBox" class="choice-grid">${shifts.map(sh=>`<button type="button" class="choice ${shiftSel.includes(sh)?'selected':''}" data-shift="${sh}" onclick="this.classList.toggle('selected');refreshShiftPeople()">${sh}</button>`).join('')}</div>
 <label>担当者名</label><div id="shiftPeople">${shiftPeopleInputs(shiftSel,defaultPeople)}</div>
 <label>教わった人</label><input id="iTeacher" list="issueTeacherHistory" value="${esc(x?.teacher||'')}" placeholder="先生・先輩など"><datalist id="issueTeacherHistory">${[...new Set([...S.lessons.map(z=>z.teacher),...S.issues.map(z=>z.teacher)].filter(Boolean))].map(t=>`<option value="${esc(t)}">`).join('')}</datalist>
 <label>タグ</label>${tagPicker(x?.tags||[])}

function analysis(){
 const issues=Array.isArray(S.issues)?S.issues:[];
 const words=issues.map(x=>({title:String(x.title||''),detail:String(x.detail||''),memo:String(x.memo||''),tags:Array.isArray(x.tags)?x.tags:[],done:!!x.done}));
 const counts={}; words.forEach(x=>x.tags.forEach(t=>{const k=String(t||'').trim();if(k)counts[k]=(counts[k]||0)+1;}));
 const top=Object.entries(counts).sort((a,b)=>b[1]-a[1]);
 const adviceFor=(text)=>{const t=String(text||'').toLowerCase();
   if(/タンギング|発音|舌|tongue/.test(t))return 'ゆっくりしたテンポで、音の粒と息の流れがそろうか確認しましょう。';
   if(/音程|ピッチ|チューナー|intonation/.test(t))return 'チューナーを使い、ロングトーンで音の中心と音の入りを確認しましょう。';
   if(/高音|ハイ.*トーン|高い音|high note/.test(t))return '無理に押さず、息の流れと口の形を確認しながら中音域から少しずつつなげましょう。';
   if(/低音|low note/.test(t))return '息を安定させ、無理に口を締めずにゆっくりしたロングトーンで確認しましょう。';
   if(/スライド|ポジション|音階/.test(t))return 'チューナーで各音を確認し、ゆっくりした音階練習から正確さを固めましょう。';
   if(/リズム|テンポ|拍/.test(t))return 'メトロノームを遅めに設定し、手拍子やリズム読みをしてから楽器で練習しましょう。';
   if(/息|ブレス|音が続か|ロングトーン/.test(t))return 'ロングトーンで息の流れを一定にし、自然なブレス位置を確認しましょう。';
   return '入力した課題を短いフレーズに分け、ゆっくり練習してから少しずつテンポを上げましょう。';};
 const searchLinks=(q)=>{const query=String(q||'トロンボーン 吹奏楽 練習方法').trim().slice(0,180);const pools=[
   [{label:'解説サイトを探す',url:'https://www.google.com/search?q='+encodeURIComponent(query+' トロンボーン 解説')},{label:'練習動画を探す',url:'https://www.youtube.com/results?search_query='+encodeURIComponent(query+' トロンボーン レッスン')}],
   [{label:'別の解説候補を探す',url:'https://www.bing.com/search?q='+encodeURIComponent(query+' トロンボーン 練習')},{label:'別の動画候補を探す',url:'https://www.youtube.com/results?search_query='+encodeURIComponent(query+' 吹奏楽 トロンボーン コツ')}],
   [{label:'楽器メーカーの解説を探す',url:'https://www.google.com/search?q='+encodeURIComponent(query+' site:yamaha.com トロンボーン')},{label:'演奏レッスン動画を探す',url:'https://www.youtube.com/results?search_query='+encodeURIComponent(query+' brass lesson trombone')}],
   [{label:'別サイトの解説を探す',url:'https://duckduckgo.com/?q='+encodeURIComponent(query+' トロンボーン 練習方法')},{label:'別の練習動画を探す',url:'https://www.youtube.com/results?search_query='+encodeURIComponent(query+' trombone practice tips')}],
   [{label:'参考記事を探す',url:'https://www.google.com/search?q='+encodeURIComponent(query+' 吹奏楽 楽器 練習 site:jp')},{label:'レッスン動画を探す',url:'https://www.youtube.com/results?search_query='+encodeURIComponent(query+' trombone tutorial')}],
   [{label:'新しい解説候補を探す',url:'https://search.yahoo.co.jp/search?p='+encodeURIComponent(query+' トロンボーン')},{label:'新しい動画候補を探す',url:'https://www.youtube.com/results?search_query='+encodeURIComponent(query+' trombone exercise')}]
 ];const idx=(Number(window.BRASS_REF_ROTATION)||0)%pools.length;return `<div class="analysis-links">${pools[idx].map(a=>`<a target="_blank" rel="noopener" href="${a.url}">${a.label} ↗</a>`).join('')}</div>`;};
 if(!issues.length)return `<div class="analysis"><b>自動分析</b><p class="muted">課題点を登録すると、入力した文字やタグに合わせて練習のヒントと参考サイトがここに自動表示されます。</p></div>`;
 const tagRows=top.length?top.slice(0,8).map(([tag,n])=>`<div style="padding:8px 0;border-top:1px solid var(--line)"><div class="between"><span class="tag selected">${esc(tag)}</span><b>${n}件</b></div><div class="muted">${esc(adviceFor(tag))}</div>${searchLinks('トロンボーン '+tag+' 練習方法')}</div>`).join(''):'';
 const issueRows=words.slice(0,12).map(x=>{const q=[x.title,...x.tags,x.detail,x.memo].filter(Boolean).join(' ');return `<div style="padding:8px 0;border-top:1px solid var(--line)"><b>${esc(x.title||x.tags.join('・')||'課題点')}</b><p class="muted">${esc(adviceFor(q))}</p>${searchLinks('トロンボーン '+q+' 練習方法')}</div>`;}).join('');
 return `<div class="analysis"><b>自動分析</b><p class="muted">課題点を保存・編集すると自動で更新されます。分析ボタンは不要です。</p>${top.length?`<p>多く登録されているタグ：<strong>${esc(top[0][0])}</strong>（${top[0][1]}件）</p>${tagRows}`:''}<div class="between"><h4>入力内容に関連する参考サイト・動画</h4><button type="button" class="btn small" onclick="refreshAnalysisSites()">↻ 参考サイトを更新</button></div><p class="muted">押すたびに、異なる検索サービスや絞り込み条件で新しい候補を探します。</p>${issueRows}${!top.length?'<p class="muted">タグがなくても、課題点の入力内容から関連検索を作成します。</p>':''}</div>`;
}

function morning(){let y=currentCal.getFullYear(),m=currentCal.getMonth(),days=new Date(y,m+1,0).getDate(),first=new Date(y,m,1).getDay(),cells=[];for(let i=0;i<first;i++)cells.push('<div class="day other"></div>');for(let d=1;d<=days;d++){let ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`, v=S.mornings[ds];cells.push(`<div class="day ${ds===today()?'today':''}" onclick="toggleMorning('${ds}')"><span class="num">${d}</span>${v?'<span class="dot goal1">出席</span>':''}</div>`)}return `<section class="page active"><div class="hero"><h2>朝練</h2><p>火〜金の4日間。過去の日付もタップで取り消し・記録できます。</p></div><div class="card"><div class="between"><button class="btn" onclick="moveCal(-1)">‹</button><b>${y}年${m+1}月</b><button class="btn" onclick="moveCal(1)">›</button></div><div class="calendar" style="margin-top:9px">${['日','月','火','水','木','金','土'].map(x=>`<div class="dow">${x}</div>`).join('')}${cells.join('')}</div><p class="muted">今週：${morningCount()}/4日　${morningCount()===4?'<b>4日達成・表彰対象</b>':'火〜金だけをカウントします。'}</p></div><div class="card"><h3>朝練王</h3>${morningRanking()}</div></section>`}
function toggleMorning(ds){let day=new Date(ds+'T12:00:00').getDay();if(day===0||day===1||day===6)return toast('朝練は火〜金のみです');if(S.mornings[ds]){delete S.mornings[ds];toast('朝練を取り消しました')}else{S.mornings[ds]={by:S.profile.name||'自分'};toast('朝練を記録しました')}save()}
function morningCount(){let now=new Date(),start=new Date(now);let day=now.getDay();let diff=day===0?6:day-2;if(diff<0)diff=0;start.setDate(now.getDate()-diff);let n=0;for(let i=0;i<4;i++){let d=new Date(start);d.setDate(start.getDate()+i);let ds=d.toISOString().slice(0,10);if(S.mornings[ds])n++}return n}
function morningRanking(){let c={};Object.values(S.mornings).forEach(v=>{let n=v.by||'自分';c[n]=(c[n]||0)+1});let a=Object.entries(c).sort((x,y)=>y[1]-x[1]);return a.length?`<div class="grid">${a.slice(0,3).map((x,i)=>`<div class="stat"><span class="muted">${i===0?'TOP ':''}${i+1}位</span><b>${esc(x[0])}</b><span>${x[1]}回</span></div>`).join('')}</div>`:'<div class="empty">まだ記録がありません</div>'}
function morningTop(){let c={};Object.values(S.mornings).forEach(v=>{let n=v.by||'自分';c[n]=(c[n]||0)+1});let a=Object.entries(c).sort((x,y)=>y[1]-x[1]);return a[0]?{name:a[0][0],count:a[0][1]}:null}

function records(){

 let totalMorning=Object.keys(mornings).length;
 let achievedGoals=goals.filter(x=>Number(x.star)===5), completedPractice=practices.filter(x=>x.done), completedIssues=issues.filter(x=>x.done);
 const countLine=(registered,completed)=>`<div class="record-counts"><span>登録 <b>${registered.length}</b>件</span><span>完了 <b>${completed.length}</b>件 ✓</span></div>`;
 const goalRows=goals.length?goals.map(x=>`<div class="goal-record"><span>${esc(x.title||'無題の目標')}</span><span>${Number(x.star)===5?'<span class="badge">✓ 完了</span>':`<span class="stars">${[1,2,3,4,5].map(n=>n<=Number(x.star)?'★':'☆').join('')}</span>`}</span></div>`).join(''):'<div class="empty">ありません</div>';
 const practiceRows=practices.length?practices.map(x=>`<div class="practice-record"><span>${esc(x.title||'無題の練習')}</span><span>${x.done?'<span class="badge">✓ 完了</span>':`<span class="muted">${esc(x.date||'')}</span>`}</span></div>`).join(''):'<div class="empty">ありません</div>';
 const issueRows=issues.length?issues.map(x=>`<div class="issue-link">${esc(x.title||'無題の課題点')} ${formatIssueMeasure(x)}${x.done?' <span class="badge">✓ 完了</span>':''}</div>`).join(''):'<div class="empty">ありません</div>';
 return `<section class="page active"><div class="hero"><h2>記録</h2></div>
 <div class="card"><h3>朝練</h3><div class="record-counts"><span>累計 <b>${totalMorning}</b>回</span></div></div>
 <div class="card"><h3>目標</h3>${countLine(goals,achievedGoals)}<div class="record-list">${goalRows}</div></div>
 <div class="card"><h3>練習</h3>${countLine(practices,completedPractice)}<div class="record-list">${practiceRows}</div></div>
 <div class="card"><h3>課題点</h3>${countLine(issues,completedIssues)}<div class="record-list">${issueRows}</div></div>
 <div class="card"><div class="between"><h3>レッスンの振り返り</h3><button class="btn primary" onclick="lessonForm()">＋記録</button></div>${lessons.length?lessons.map(lessonCard).join(''):'<div class="empty">まだありません</div>'}</div>
 </section>`;
}
function lessonCard(x){return `<div class="item swipe" data-id="${esc(x.id||'')}" data-type="lesson"><div class="item-main"><div class="between"><b>${esc(x.date||'日付未設定')}・${esc(x.teacher||'教わった人未設定')}</b><span class="badge">${x.share==='private'?'自分だけ':'共有'}</span></div>${x.group?`<p><b>合奏：</b>${esc(x.group)}</p>`:''}${x.individual?`<p><b>個人：</b>${esc(x.individual)}</p>`:''}${x.reflection?`<p><b>振り返り：</b>${esc(x.reflection)}</p>`:''}${(x.files||[]).filter(f=>typeof f==='string'&&f.startsWith('data:image/')).map(src=>`<img style="width:64px;height:64px;object-fit:cover;border-radius:8px;margin:3px" src="${src}" onclick="zoomImg(this.src)">`).join('')}</div><div class="item-actions"><button onclick="lessonForm(S.lessons.find(z=>z.id==='${String(x.id||'').replace(/'/g, '&#39;')}'))">編集</button><button class="del" onclick="delLesson('${String(x.id||'').replace(/'/g, '&#39;')}')">削除</button></div></div>`}
function delLesson(id){S.lessons=S.lessons.filter(x=>x.id!==id);save();toast('レッスン記録を削除しました')}

function lessonForm(x){
 openModal(`<h3>${x?'レッスンの振り返りを編集':'レッスンの振り返り'}</h3><label>日付</label><input id="lDate" type="date" value="${x?.date||today()}"><label>教わった人</label><input id="lTeacher" list="teacherHistory" value="${esc(x?.teacher||'')}"><datalist id="teacherHistory">${[...new Set(S.lessons.map(z=>z.teacher).filter(Boolean))].map(t=>`<option value="${esc(t)}">`).join('')}</datalist><label>合奏・全体で教わったこと</label><textarea id="lGroup">${esc(x?.group||'')}</textarea><label>個人で教わったこと</label><textarea id="lIndividual">${esc(x?.individual||'')}</textarea><label>振り返り・次にやること</label><textarea id="lReflection">${esc(x?.reflection||'')}</textarea><label>写真/動画/ファイルを選択</label><input id="lFiles" type="file" accept="image/*,video/*,audio/*" multiple>${(x?.files||[]).map(src=>`<img style="width:70px;height:70px;object-fit:cover;border-radius:8px;margin:4px" src="${src}" onclick="zoomImg('${src.replace(/'/g,"\'")}')">`).join('')}<label>公開範囲</label><select id="lShare"><option value="group" ${x?.share!=='private'?'selected':''}>グループで共有</option><option value="private" ${x?.share==='private'?'selected':''}>自分だけ</option></select><div class="muted">登録者：${esc(x?.registrant||S.profile.name||'未設定')}</div><div class="row"><button class="btn primary" onclick="saveLesson('${x?.id||''}')">保存</button><button class="btn" onclick="saveLessonAndAddIssue('${x?.id||''}')">保存して課題点を追加</button><button class="btn" onclick="closeModal()">閉じる</button></div>`)
}
function saveLesson(id,afterSave){
 let old=id&&S.lessons.find(x=>x.id===id),files=[...(document.getElementById('lFiles')?.files||[])],arr=structuredClone(old?.files||[]),newId=id||uid();
 let finish=()=>{let d={id:newId,date:val('lDate'),teacher:val('lTeacher'),group:val('lGroup'),individual:val('lIndividual'),reflection:val('lReflection'),files:arr,share:val('lShare'),registrant:old?.registrant||S.profile.name||'未設定'};if(old)Object.assign(old,d);else S.lessons.unshift(d);closeModal();save();toast('レッスンを保存しました');if(afterSave)afterSave(newId)};
 if(!files.length)return finish();let left=files.length;files.forEach(f=>{let r=new FileReader();r.onload=()=>{arr.push(r.result);if(!--left)finish()};r.readAsDataURL(f)})
}
function saveLessonAndAddIssue(id){saveLesson(id,newId=>setTimeout(()=>issueForm(),80))}

function editLesson(id){lessonForm(S.lessons.find(x=>x.id===id))}
function delLesson(id){S.lessons=S.lessons.filter(x=>x.id!==id);save();toast('削除しました')}

function voice(){
 return `<section class="page active"><div class="hero"><h2>みんなの声</h2></div><div class="card"><button class="btn primary" onclick="voiceForm()">＋投稿</button></div>${S.posts.length?S.posts.map(p=>`<div class="item swipe voice-card" data-id="${p.id}" data-type="voice"><div class="item-main"><b>匿名</b>${p.replyTo?`<div class="card" onclick="event.stopPropagation();jumpToPost('${p.replyTo}')"><span class="muted">返信先（タップで元の投稿へ）</span><p>${esc(S.posts.find(z=>z.id===p.replyTo)?.text||p.replyText||'元の投稿')}</p></div>`:''}<p>${esc(p.text)}</p><div class="muted">${esc(p.date||'')}</div><button class="btn small" onclick="replyVoice('${p.id}')">返信</button></div><div class="item-actions"><button onclick="editVoice('${p.id}')">編集</button><button class="del" onclick="deleteVoice('${p.id}')">削除</button></div></div>`).join(''):'<div class="empty">まだありません</div>'}<div class="card"><h3>おすすめ</h3><button class="btn primary" onclick="recommendForm()">＋おすすめを登録</button>${S.recommendations.filter(r=>r&&((r.title||'').trim()||(r.url||'').trim())).map(r=>`<div class="item swipe" data-id="${r.id}" data-type="recommend"><div class="item-main"><div class="between"><b>${esc(r.title)}</b>${r.url?`<a class="btn small" target="_blank" rel="noopener" href="${esc(r.url)}">URLを開く</a>`:''}</div>${r.url?`<div class="muted">${esc(r.url)}</div>`:''}</div><div class="item-actions"><button onclick="editRecommend('${r.id}')">編集</button><button class="del" onclick="deleteRecommend('${r.id}')">削除</button></div></div>`).join('')}</div></section>`
}
function voiceForm(x,replyTo=''){const original=replyTo?S.posts.find(p=>p.id===replyTo):null;openModal(`<h3>${replyTo?'匿名で返信':x?'みんなの声を編集':'みんなの声'}</h3>${original?`<div class="card"><span class="muted">返信先：匿名</span><p>${esc(original.text)}</p></div>`:''}<textarea id="vText" placeholder="自由に書いてください">${esc(x?.text||'')}</textarea><label>公開範囲</label><select id="vShare"><option value="group" ${x?.share!=='private'?'selected':''}>グループで共有</option><option value="private" ${x?.share==='private'?'selected':''}>自分だけ</option></select><div class="muted">登録者：${esc(x?.registrant||S.profile.name||'未設定')}</div><button class="btn primary" style="margin-top:10px" onclick="saveVoice('${x?.id||''}','${replyTo}')">保存</button>`)}
function saveVoice(id,replyTo=''){let old=id&&S.posts.find(x=>x.id===id),parent=replyTo&&S.posts.find(x=>x.id===replyTo),d={id:id||uid(),text:val('vText'),date:old?.date||today(),share:val('vShare'),registrant:'匿名',replyTo:replyTo||old?.replyTo||'',replyText:parent?.text||old?.replyText||''};if(!d.text)return toast('内容を入力してください');if(old)Object.assign(old,d);else S.posts.unshift(d);closeModal();save()}
function editVoice(id){voiceForm(S.posts.find(x=>x.id===id))}
function replyVoice(id){voiceForm(null,id)}
function jumpToPost(id){const el=document.querySelector(`.voice-card[data-id="${id}"]`);if(el){closeModal();el.scrollIntoView({behavior:'smooth',block:'center'});el.style.outline='2px solid var(--c)';setTimeout(()=>el.style.outline='',1500)}else toast('元の投稿が見つかりません')}
function deleteVoice(id){S.posts=S.posts.filter(x=>x.id!==id);save();toast('削除しました')}
function validUrl(u){try{let x=new URL(u);return x.protocol==='http:'||x.protocol==='https:'}catch(e){return false}}
function recommendForm(x){openModal(`<h3>${x?'おすすめを編集':'おすすめを登録'}</h3><label>題名</label><input id="rTitle" value="${esc(x?.title||'')}"><label>URL</label><input id="rUrl" type="url" value="${esc(x?.url||'')}" placeholder="https://..."><div id="urlWarn" class="muted" style="display:none">URLは http:// または https:// から始めてください。</div><label>公開範囲</label><select id="rShare"><option value="group" ${x?.share!=='private'?'selected':''}>グループで共有</option><option value="private" ${x?.share==='private'?'selected':''}>自分だけ</option></select><div class="muted">登録者：${esc(x?.registrant||S.profile.name||'未設定')}</div><button class="btn primary" style="margin-top:10px" onclick="saveRecommend('${x?.id||''}')">保存</button>`)}
function saveRecommend(id){let u=val('rUrl');if(u&&!validUrl(u)){document.getElementById('urlWarn').style.display='block';return}let old=id&&S.recommendations.find(x=>x.id===id),d={id:id||uid(),title:val('rTitle'),url:u,share:val('rShare'),registrant:old?.registrant||S.profile.name||'未設定'};if(old)Object.assign(old,d);else S.recommendations.unshift(d);closeModal();save()}
function editRecommend(id){recommendForm(S.recommendations.find(x=>x.id===id))}
function deleteRecommend(id){S.recommendations=S.recommendations.filter(x=>x.id!==id);save();toast('削除しました')}

function settings(){return `<section class="page active"><div class="hero"><h2>設定</h2></div><div class="card"><h3>参加メンバー</h3><div id="groupMembersSettings"><p class="muted">グループに参加すると、メンバー名を押してプロフィールを確認できます。</p></div></div><div class="card"><h3>項目の並べ替え・表示</h3><p class="muted">タブの順番や表示・非表示を変更できます。</p><button class="btn primary" onclick="sectionSettings()">設定する</button></div><div class="card"><h3>AI・サーバー</h3><p class="muted">サーバー版では課題点をAI分析し、検索した信頼できる参考サイトのURLを表示できます。</p><p class="muted">課題点の画面に、タグや入力内容に関連する分析と参考サイトが自動表示されます。</p></div><div class="card"><h3>データ</h3><button class="btn" onclick="backup()">バックアップ</button><button class="btn" onclick="document.getElementById('restore').click()">復元</button><input id="restore" type="file" accept="application/json" hidden onchange="restore(this.files[0])"></div></section>`}

function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='BRASS_PLUS_backup.json';a.click();toast('バックアップを作成しました')}
function restore(file){if(!file)return;let r=new FileReader();r.onload=()=>{try{S=Object.assign(structuredClone(defaultState),JSON.parse(r.result));save();toast('復元しました')}catch(e){toast('復元できませんでした')}};r.readAsText(file)}

function sectionSettings(){let base=[['home','ホーム'],['goals','目標'],['practice','練習'],['issues','課題点'],['morning','朝練'],['songs','曲リスト'],['records','記録'],['voice','みんなの声']],order=S.navOrder||base.map(x=>x[0]),prefs=S.sectionPrefs||{};order=order.map(k=>k==='more'||k==='settings'?'home':k).filter(k=>base.some(x=>x[0]===k));base.forEach(x=>{if(!order.includes(x[0]))order.push(x[0])});openModal(`<h3>項目の並べ替え・表示</h3>${order.map(k=>{let n=base.find(x=>x[0]===k);return `<div class="section-setting" data-k="${k}"><b>${n[1]}</b><div class="row"><button class="btn small" onclick="moveSection('${k}',-1)">↑</button><button class="btn small" onclick="moveSection('${k}',1)">↓</button><button class="btn small ${prefs[k]?.visible===false?'':'selected'}" onclick="toggleSectionVisible('${k}')">${prefs[k]?.visible===false?'非表示':'表示中'}</button></div></div>`}).join('')}<div class="row" style="margin-top:12px"><button class="btn primary" onclick="closeModal();render()">完了</button></div>`)}
function moveSection(k,d){let a=[...(S.navOrder||[])],i=a.indexOf(k),j=i+d;if(i<0||j<0||j>=a.length)return;a.splice(i,1);a.splice(j,0,k);S.navOrder=a;save();setTimeout(sectionSettings,0)}
function toggleSectionVisible(k){S.sectionPrefs=S.sectionPrefs||{};S.sectionPrefs[k]=S.sectionPrefs[k]||{};S.sectionPrefs[k].visible=S.sectionPrefs[k].visible===false;save();setTimeout(sectionSettings,0)}

function doSearch(q){q=q.trim().toLowerCase();let old=document.getElementById('searchResults');if(old)old.remove();if(!q)return;let data=[];S.goals.forEach(x=>data.push({type:'目標',title:x.title,view:'goals',id:x.id}));S.practices.forEach(x=>data.push({type:'練習',title:x.title,view:'practice',id:x.id}));S.issues.forEach(x=>data.push({type:'課題点',title:x.title,view:'issues',id:x.id}));S.songs.forEach(x=>data.push({type:'曲',title:x.title,view:'songs',id:x.id}));S.lessons.forEach(x=>data.push({type:'レッスン',title:x.teacher||x.date,view:'records',id:x.id}));let hit=data.filter(x=>x.title.toLowerCase().includes(q));let box=document.createElement('div');box.id='searchResults';box.className='card';box.style.position='sticky';box.style.top='155px';box.style.zIndex='30';box.innerHTML=hit.length?'<b>検索結果</b>'+hit.slice(0,15).map(x=>`<div class="item" onclick="searchJump('${x.view}','${x.id}')"><div class="item-main"><span class="badge">${x.type}</span><b>${esc(x.title)}</b><span class="right">›</span></div></div>`).join(''):'<div class="empty">見つかりませんでした</div>';document.querySelector('main').prepend(box)}
function searchJump(view,id){document.getElementById('search').value='';document.getElementById('searchResults')?.remove();go(view);setTimeout(()=>{let el=document.querySelector(`[data-id="${id}"]`);if(el){el.scrollIntoView({behavior:'smooth',block:'center'});el.style.outline='3px solid var(--c)';setTimeout(()=>el.style.outline='',1600)}},50)}

document.addEventListener('touchstart',e=>{let el=e.target.closest('.swipe');if(el)touchStart={x:e.touches[0].clientX,el}}, {passive:true});
document.addEventListener('touchend',e=>{if(!touchStart)return;let dx=e.changedTouches[0].clientX-touchStart.x;if(Math.abs(dx)>55){let el=touchStart.el.querySelector('.item-main');el.style.transform=dx<0?'translateX(-145px)':'translateX(0)'}touchStart=null},{passive:true});
S.navOrder=(S.navOrder||[]).map(k=>k==='more'?'settings':k);if(!S.navOrder.includes('settings'))S.navOrder.push('settings');S.navOrder=S.navOrder.filter((k,i,a)=>['home','goals','practice','issues','morning','songs','records','voice','settings'].includes(k)&&a.indexOf(k)===i);
render();
setTimeout(async()=>{await serverRefresh(false,!!serverConfig().code)},250);
</script><script>
(function(){
 const DB='BRASS_PLUS_DB_V5',STORE='state',KEY='main';
 function openDB(){return new Promise((resolve,reject)=>{
  if(!indexedDB)return reject();
  const q=indexedDB.open(DB,1);
  q.onupgradeneeded=()=>q.result.createObjectStore(STORE);
  q.onsuccess=()=>resolve(q.result); q.onerror=()=>reject(q.error);
 });}
 window.brassPersist={
  put:async function(v){try{const db=await openDB();return await new Promise((r,j)=>{const t=db.transaction(STORE,'readwrite');t.objectStore(STORE).put(v,KEY);t.oncomplete=()=>r(true);t.onerror=()=>j(t.error)})}catch(e){return false}},
  get:async function(){try{const db=await openDB();return await new Promise((r,j)=>{const q=db.transaction(STORE,'readonly').objectStore(STORE).get(KEY);q.onsuccess=()=>r(q.result||null);q.onerror=()=>j(q.error)})}catch(e){return null}}
 };
})();
</script><script>
document.addEventListener('DOMContentLoaded',()=>{document.querySelectorAll('input[type=file]').forEach(i=>{let l=document.querySelector('label[for="'+i.id+'"]');if(l)l.textContent='写真/動画/ファイルを選択'});});
</script>
<script>
document.addEventListener('DOMContentLoaded',()=>{
  S.scaleChecks=S.scaleChecks||{};S.mySlides=S.mySlides||[];S.sectionPrefs=S.sectionPrefs||{};
  S.issues=(S.issues||[]).map(x=>({...x,measureStart:x.measureStart||x.measure||'',measureEnd:x.measureEnd||''}));
  S.lessons=(S.lessons||[]).map(x=>({...x,teacher:x.teacher||x.taughtBy||''}));
  S.songs=(S.songs||[]).map(x=>({...x,photos:x.photos||{}}));
});

let brassEventStream=null,brassStreamGroup='';
async function connectBrassEventStream(){const c=serverConfig();if(!c.code||!serverBase()){if(brassEventStream){brassEventStream.close();brassEventStream=null;brassStreamGroup=''}return}const code=c.code;if(brassEventStream&&brassStreamGroup===code)return;if(brassEventStream)brassEventStream.close();brassEventStream=null;brassStreamGroup=code;try{const key='BRASS_PLUS_EVENT_CURSOR_'+code;let after=Number(localStorage.getItem(key)||0);if(!localStorage.getItem(key)){const initial=await serverJson('/api/groups/'+encodeURIComponent(code)+'/events?after=0&clientId='+encodeURIComponent(brassClientId()));after=Number(initial.latestId)||0;localStorage.setItem(key,String(after))}if(serverConfig().code!==code)return;const url=serverBase()+'/api/groups/'+encodeURIComponent(code)+'/stream?after='+after+'&clientId='+encodeURIComponent(brassClientId());const stream=new EventSource(url);brassEventStream=stream;stream.addEventListener('notification',ev=>{try{const item=JSON.parse(ev.data);const latest=Math.max(Number(localStorage.getItem(key)||0),Number(item.id)||0);localStorage.setItem(key,String(latest));toast((item.actor?item.actor+'：':'')+item.detail);if(item.type==='item-added'||item.type==='item-updated')serverRefresh(false)}catch(e){console.warn('BRASS+ notification',e)}});stream.addEventListener('group-missing',()=>{toast('グループが見つかりません。グループ管理を確認してください。');stream.close();if(brassEventStream===stream)brassEventStream=null});stream.onerror=()=>{/* EventSource automatically reconnects */}}catch(e){console.warn('BRASS+ realtime stream',e)}}
setInterval(()=>{if(serverConfig().code){serverRefresh(false);connectBrassEventStream()}else if(brassEventStream){brassEventStream.close();brassEventStream=null;brassStreamGroup=''}},5000);
connectBrassEventStream();
</script>
